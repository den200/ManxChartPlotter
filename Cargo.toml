[package]
name = "navcore2"
version = "0.4.0"
edition = "2021"
# `src/bin/signalk-sim.rs` is auto-discovered, so a bare `cargo run` sees two
# binaries and refuses to guess. The plotter is the one you mean.
default-run = "navcore"

[[bin]]
name = "navcore"
path = "src/bin/navcore.rs"

[dependencies]
# Existing
anyhow = "1.0"
log = "0.4"
quick-xml = "0.31"
thiserror = "1.0"
tempfile = "3.10"

# Rendering (M1) - wgpu 22.1 (plan said 0.26 but that version never existed)
# wgpu jumped from 0.21 → 22.0 for semver compliance
wgpu = "22.1"
winit = "0.30"
pollster = "0.4"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }

# SENC parsing
byteorder = "1.5"

# Disk cache
dirs = "5.0"

# Symbol rendering (M2)
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"


# Polygon tessellation with holes
earcutr = "0.4"

# Parallel tile building
rayon = "1.10"

# UI. 0.29 is the release that pairs with wgpu 22.1 and winit 0.30 — the
# versions navcore already uses — so the chart renderer is untouched by it.
# egui draws in its own pass over the resolved surface; it owns no window, no
# event loop and no part of the chart pipeline.
egui = "0.29"
egui-wgpu = "0.29"
# `clipboard` is one of egui-winit's default features and turning defaults off
# took paste with it — a password field you cannot paste into is not a small
# annoyance when the password is 30 random characters.
egui-winit = { version = "0.29", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }

# The o-charts shop client. Blocking HTTP on a worker thread rather than an
# async runtime: the shop is a handful of requests at the dock, not a hot path,
# and a runtime would be the largest dependency in the tree for it.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Signal K. The plan (4.1) named tokio-tungstenite; this is the same protocol
# without the runtime. One socket read in a loop does not need an executor, and
# tokio would be the largest crate in the tree — on a Pi 4 that is binary size
# and scheduler overhead bought for nothing. Same shape as the shop worker:
# blocking I/O on its own thread, results drained by the UI each frame.
#
# `handshake` is a default feature and carries `tungstenite::connect` with it —
# turning defaults off removes the function that opens a connection. The same
# trap as egui-winit's clipboard; see the egui-integration-traps note.
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
geographiclib-rs = "0.2.7"

# Routes and waypoints (routing spec §4). Uuid is the id type the spec's data
# model names, and chrono is its DateTime<Utc> at the API boundary — plus the
# RFC3339 timestamps GPX carries. GPX itself is read and written by hand on
# quick-xml: the `gpx` crate drops unknown extension elements on parse, and the
# spec requires round-trips through other plotters to be lossless.
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
gribberish = "1.6.0"
