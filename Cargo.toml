[package]
name = "navcore2"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "navcore"
path = "src/bin/navcore.rs"

[dependencies]
# Existing
anyhow = "1.0"
log = "0.4"
quick-xml = "0.31"
thiserror = "1.0"
tempfile = "3.10"

# Rendering (M1) - wgpu 22.1 (plan said 0.26 but that version never existed)
# wgpu jumped from 0.21 → 22.0 for semver compliance
wgpu = "22.1"
winit = "0.30"
pollster = "0.4"
glam = "0.29"
bytemuck = { version = "1.21", features = ["derive"] }

# SENC parsing
byteorder = "1.5"

# Disk cache
dirs = "5.0"

# Symbol rendering (M2)
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"


# Polygon tessellation with holes
earcutr = "0.4"

# Parallel tile building
rayon = "1.10"
